name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# macOS-hosted runners bill at a 10x multiplier vs. Linux — a rapid string of
# pushes to the same branch (a real pattern during active AFK work) used to
# let every superseded run keep burning minutes to completion instead of
# being superseded. This cancels any in-progress run for the same ref the
# moment a newer push arrives, since only the latest push's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `brew install xcodegen` -- an unpinned install
      # floats to whatever Homebrew's formula currently points at, which
      # silently drifted past the version used to generate the committed
      # Cobux.xcodeproj and made the drift check below fail on every push
      # regardless of the actual change (confirmed: XcodeGen's own project-
      # generation logic, not just its version string, changed target
      # ordering between versions). Bump this deliberately -- alongside
      # regenerating and committing Cobux.xcodeproj with the SAME version
      # locally -- not as a side effect of Homebrew updating.
      - name: Install XcodeGen (pinned to 2.45.4)
        run: |
          curl -sL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Regenerate Xcode project
        run: xcodegen generate

      # Cobux.xcodeproj is committed alongside project.yml — if xcodegen output
      # differs from what's checked in, project.yml and the .xcodeproj have silently
      # drifted apart. Fail loudly rather than let that compound.
      - name: Verify project.yml and Cobux.xcodeproj haven't drifted
        run: git diff --exit-code Cobux.xcodeproj

      - name: Run CobuxCore tests (pure logic, host-only, no simulator)
        run: swift test --package-path CobuxCore

      - name: Install SwiftLint
        run: brew install swiftlint

      # Escalated from informational to blocking, but NOT --strict yet -- two
      # different things. Every error-severity rule (raw system color, hardcoded
      # hex, magic corner radius, inline material card, nested nav stack) is
      # verified clean across the whole tree (manual grep for each rule's exact
      # pattern, since this session's local SwiftLint install crashes on
      # sourcekitd loading on this machine's beta macOS -- a real, separate
      # environment issue, not evidence either way about violations). Plain
      # `swiftlint lint` only fails on those. The two warning-severity rules
      # (no_bare_padding, no_negative_offset_bleed_hack) still have real,
      # uninventoried violations across ~10 files (BookDetailView alone has 7+
      # bare .padding() calls) -- --strict would promote those to failures and
      # turn this red immediately. That cleanup is real, separate follow-up
      # work, not something to rush through unreviewed here.
      - name: SwiftLint (blocking on errors; --strict pending a bare-padding/negative-offset pass)
        run: swiftlint lint

      # CODE_SIGNING_ALLOWED=NO because CI has no Apple Developer credentials
      # (and shouldn't -- that's a real credential, not something to hand a
      # CI runner) and doesn't need any: this step exists to catch compile
      # errors, not to produce an installable binary. Rajan's own local
      # archive/upload (Phase 6, still gated on his release Xcode install)
      # is the actual signed build and is untouched by this.
      - name: Build app + widget (Debug, generic iOS device — no simulator)
        run: |
          xcodebuild -project Cobux.xcodeproj -scheme Cobux \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      # The iOS-destination build above already builds CobuxWatch/CobuxWatchWidgets as an
      # embedded dependency of the Cobux target (confirmed: "Embed Watch Content" copy phase),
      # but that's implicit coverage a future scheme/dependency edit could silently drop.
      # Explicit per Fable's Watch companion ruling, so CI keeps catching it either way.
      - name: Build Watch app + complications (Debug, generic watchOS device)
        run: |
          xcodebuild -project Cobux.xcodeproj -scheme CobuxWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Run app test target (headless simulator runtime — never opens Simulator.app)
        run: |
          xcodebuild -project Cobux.xcodeproj -scheme Cobux \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skip-testing:CobuxTests/SnapshotTests test

      # SnapshotTests has never been run anywhere -- no local Mac in this project has a
      # simulator runtime installed, so no reference images exist yet under
      # Tests/__Snapshots__/. Split out from the blocking run above (which would fail on
      # every push otherwise) so it can record baselines without turning CI red first.
      # Once this step's artifact images are reviewed and committed to
      # Tests/__Snapshots__/, remove -skip-testing above and delete this separate step --
      # SnapshotTests belongs in the normal blocking run from then on.
      - name: Record/verify snapshot tests (informational until baselines are committed)
        run: |
          xcodebuild -project Cobux.xcodeproj -scheme Cobux \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:CobuxTests/SnapshotTests test || true
